<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            color: white;
            backdrop-filter: blur(10px);
        }
        
        input[type="file"] {
            color: white;
            margin-bottom: 10px;
        }
        
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <input type="file" id="modelInput" accept=".glb,.gltf,.fbx,.obj" />
        <button onclick="resetCamera()">Сброс камеры</button>
        <button onclick="toggleAxes()" id="axesBtn">Оси: ВКЛ</button>
        <button onclick="toggleGrid()" id="gridBtn">Сетка: ВКЛ</button>
    </div>
    
    <div class="info">
        Поддерживаемые форматы: .glb, .gltf, .fbx, .obj<br>
        ЛКМ + перемещение: вращение, ПКМ + перемещение: панорамирование, Колесо: масштаб
    </div>
    
    <div class="loading" id="loading">
        Загрузка модели...
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Основные переменные
        let scene, camera, renderer, controls;
        let currentModel = null;
        let axesVisible = true;
        let gridVisible = true;

        // Инициализация сцены
        function init() {
            // Создание сцены
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // Создание камеры
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 10, 10);

            // Создание рендерера
            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Освещение
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Сетка
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            gridHelper.name = 'grid';
            scene.add(gridHelper);

            // Оси координат
            const axesHelper = new THREE.AxesHelper(5);
            axesHelper.name = 'axes';
            scene.add(axesHelper);

            // OrbitControls - свободная камера
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 1;
            controls.maxDistance = 500;
            controls.maxPolarAngle = Math.PI; // Можно вращать под любым углом

            // Обработчики событий
            window.addEventListener('resize', onWindowResize);
            document.getElementById('modelInput').addEventListener('change', handleFileSelect);

            // Запуск анимации
            animate();
        }

        // Обработка выбора файла
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading(true);

            const fileName = file.name.toLowerCase();
            const extension = fileName.split('.').pop();
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                
                // Удаляем предыдущую модель
                if (currentModel) {
                    scene.remove(currentModel);
                }

                loadModel(arrayBuffer, file, extension);
            };
            reader.readAsArrayBuffer(file);
        }

        // Загрузка модели
        function loadModel(arrayBuffer, file, extension) {
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);

            try {
                switch(extension) {
                    case 'glb':
                    case 'gltf':
                        loadGLTF(url);
                        break;
                    case 'fbx':
                        loadFBX(url);
                        break;
                    case 'obj':
                        loadOBJ(url);
                        break;
                    default:
                        alert('Неподдерживаемый формат файла');
                        showLoading(false);
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                alert('Ошибка загрузки модели: ' + error.message);
                showLoading(false);
                URL.revokeObjectURL(url);
            }
        }

        // Загрузка GLTF/GLB
        function loadGLTF(url) {
            const loader = new THREE.GLTFLoader();
            loader.load(url, 
                function(gltf) {
                    currentModel = gltf.scene;
                    setupModel(currentModel);
                    URL.revokeObjectURL(url);
                    showLoading(false);
                },
                function(progress) {
                    console.log((progress.loaded / progress.total * 100) + '% загружено');
                },
                function(error) {
                    console.error('Ошибка загрузки GLTF:', error);
                    alert('Ошибка загрузки модели: ' + error.message);
                    showLoading(false);
                    URL.revokeObjectURL(url);
                }
            );
        }

        // Загрузка FBX
        function loadFBX(url) {
            const loader = new THREE.FBXLoader();
            loader.load(url, 
                function(object) {
                    currentModel = object;
                    setupModel(currentModel);
                    URL.revokeObjectURL(url);
                    showLoading(false);
                },
                function(progress) {
                    console.log((progress.loaded / progress.total * 100) + '% загружено');
                },
                function(error) {
                    console.error('Ошибка загрузки FBX:', error);
                    alert('Ошибка загрузки модели: ' + error.message);
                    showLoading(false);
                    URL.revokeObjectURL(url);
                }
            );
        }

        // Загрузка OBJ
        function loadOBJ(url) {
            const loader = new THREE.OBJLoader();
            loader.load(url, 
                function(object) {
                    currentModel = object;
                    setupModel(currentModel);
                    URL.revokeObjectURL(url);
                    showLoading(false);
                },
                function(progress) {
                    console.log((progress.loaded / progress.total * 100) + '% загружено');
                },
                function(error) {
                    console.error('Ошибка загрузки OBJ:', error);
                    alert('Ошибка загрузки модели: ' + error.message);
                    showLoading(false);
                    URL.revokeObjectURL(url);
                }
            );
        }

        // Настройка загруженной модели
        function setupModel(model) {
            scene.add(model);
            
            // Центрирование модели
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            // Центрируем модель в начале координат
            model.position.x -= center.x;
            model.position.y -= center.y;
            model.position.z -= center.z;
            
            // Настройка камеры под размер модели
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / Math.sin(fov / 2));
            
            cameraZ *= 1.5; // Отступ для лучшего обзора
            camera.position.set(cameraZ, cameraZ, cameraZ);
            controls.target.set(0, 0, 0);
            controls.update();
            
            // Включение теней для всех мешей модели
            model.traverse(function(child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
        }

        // Показать/скрыть индикатор загрузки
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Сброс камеры
        function resetCamera() {
            camera.position.set(10, 10, 10);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // Переключение осей координат
        function toggleAxes() {
            axesVisible = !axesVisible;
            const axes = scene.getObjectByName('axes');
            if (axes) axes.visible = axesVisible;
            document.getElementById('axesBtn').textContent = 
                'Оси: ' + (axesVisible ? 'ВКЛ' : 'ВЫКЛ');
        }

        // Переключение сетки
        function toggleGrid() {
            gridVisible = !gridVisible;
            const grid = scene.getObjectByName('grid');
            if (grid) grid.visible = gridVisible;
            document.getElementById('gridBtn').textContent = 
                'Сетка: ' + (gridVisible ? 'ВКЛ' : 'ВЫКЛ');
        }

        // Обработка изменения размера окна
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Инициализация при загрузке страницы
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
